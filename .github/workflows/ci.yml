name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # No CognoDB credentials are needed: the driver is created lazily inside
      # request handlers, and every route that reads the graph is dynamic, so
      # nothing connects to the database at build time.
      - name: Build
        run: npm run build
